# GithubManagement から呼び出す thin caller ワークフロー
# ロジックは reusable ワークフロー側で管理され、@main 更新時に各リポジトリへ自動反映されます
# トリガー定義はこのファイル側のため、変更時は Sync Static Templates が必要です

name: Review & CI Orchestration

on:
  pull_request_review:
    types: [submitted]
  # Xcode Cloud 等の CI 完了をイベント駆動で検知（全リポ 10 分 cron は廃止して Actions 消費を抑制）
  check_run:
    types: [completed]

jobs:
  orchestration:
    uses: myapp-fa-sorasystem/GithubManagement/.github/workflows/reusable-review-ci-orchestration.yml@main
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      checks: read
